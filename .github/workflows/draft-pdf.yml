name: Draft PDF
on:
  push:
    paths:
      - 'paper/**'

jobs:
  paper:
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build PlantUML diagrams
        # JOSS's PDF build (below) is plain Pandoc/LaTeX and can't render
        # diagram source itself, so diagrams have to be pre-rendered to
        # images before that step runs.
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz fonts-open-sans
          curl -fsSL -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar
          java -jar plantuml.jar -tpng -Sdpi=200 paper/timeline-class-diagram.puml
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: paper/paper.pdf
      - name: Add and commit
        run: |
          git config --global user.name 'Paper Workflow Bot'
          git config --global user.email 'paper_bot@tilia.github.io'
          git add paper/paper.pdf paper/timeline-class-diagram.png
          git commit -m "[skip ci] Update: paper.pdf"
          git push

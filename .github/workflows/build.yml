name: Build TiLiA

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build with Nuitka
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    outputs:
      linux-build: ${{ steps.set-path.outputs.path }}
    strategy:
      matrix:
        os: [
          macos-latest,
          macos-15-intel,
          ubuntu-22.04,
          windows-latest
          ]
    env:
      QT_DEBUG_PLUGINS: 1
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: "pip"

      - name: Setup additional Linux dependencies
        if: runner.os == 'Linux'
        run: |
          chmod +x ./scripts/linux-setup.sh
          ./scripts/linux-setup.sh

      - name: Remove problematic brew libs (see Nuitka/Nuitka#2853)
        if: runner.os == 'macOS' && runner.arch != 'ARM64'
        run: |
          brew remove --force --ignore-dependencies openssl@3
          brew cleanup openssl@3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group build

      - name: Set up .NET 10 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          # brew is reliable on macOS runners; setup-dotnet fails on Intel. Force-link to
          # overwrite any stale runner dotnet, then export DOTNET_ROOT from Homebrew's libexec.
          brew install dotnet@10 2>/dev/null || true
          brew link --overwrite dotnet 2>/dev/null || true
          BREW_DOTNET="$(brew --prefix dotnet 2>/dev/null || echo '')"
          if [ -n "$BREW_DOTNET" ] && [ -d "$BREW_DOTNET/libexec" ]; then
            echo "DOTNET_ROOT=$BREW_DOTNET/libexec" >> "$GITHUB_ENV"
          fi

      - name: Install vpk CLI
        shell: bash
        run: |
          dotnet tool install -g vpk --prerelease
          echo "=== vpk smoke-test ===" && vpk --help 2>&1 | head -3

      - name: Build executable
        id: build-exe
        shell: bash
        run: |
          echo "python scripts/deploy.py ${{github.ref_name}} ${{matrix.os}}" | bash

      - name: Test installer [mac]
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SETUP=$(find "${{ steps.build-exe.outputs.vpk-outdir }}" -name "*-Setup.pkg" | head -1)
          sudo installer -pkg "$SETUP" -target /
          APP=$(find /Applications -maxdepth 1 -name "TiLiA*.app" 2>/dev/null | head -1)
          BINARY="$APP/Contents/MacOS/${{ steps.build-exe.outputs.out-binary-name }}"
          echo "Starting GUI..."
          "$BINARY" &
          APP_PID=$!
          sleep 10
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "::error::Process terminated early! Potential errors in build."
            exit 1
          fi
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          echo "Starting CLI..."
          "$BINARY" --user-interface=cli &
          CLI_PID=$!
          sleep 10
          kill $CLI_PID 2>/dev/null || echo "WARNING: CLI exited before 10s"
          wait $CLI_PID 2>/dev/null || true

      - name: Test installer [Windows]
        if: runner.os == 'Windows'
        shell: bash
        run: |
          SETUP=$(find "${{ steps.build-exe.outputs.vpk-outdir }}" -name "*-Setup.exe" | head -1)
          "$SETUP" --silent
          INSTALL_DIR="$(cygpath "$LOCALAPPDATA")/TiLiA"
          BINARY=$(find "$INSTALL_DIR/current" -maxdepth 1 -name "${{ steps.build-exe.outputs.stable-exe-name }}" 2>/dev/null | head -1)
          if [ -z "$BINARY" ]; then
            echo "::error::Installed binary not found in $INSTALL_DIR/current"
            exit 1
          fi
          echo "Starting GUI..."
          start=$(date +%s)
          timeout 10 "$BINARY" || true
          if (($(date +%s) - $start < 10)); then
            echo "::error::Process terminated early! Potential errors in build."
            exit 1
          fi
          echo "Starting CLI..."
          timeout 10 "$BINARY" --user-interface=cli || true

      - name: Test portable [Linux]
        id: set-path
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VPK_DIR="${{ steps.build-exe.outputs.vpk-outdir }}"
          APPIMAGE=$(find "$VPK_DIR" -name "*.AppImage" 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found in $VPK_DIR"; exit 1
          fi
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR" && "$APPIMAGE" --appimage-extract 2>/dev/null || true
          BINARY=$(find "$TMPDIR/squashfs-root" -maxdepth 3 -name "${{ steps.build-exe.outputs.stable-exe-name }}" -type f | head -1)
          chmod +x "$BINARY"
          echo "path=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"
          echo "Starting GUI..."
          start=$(date +%s)
          timeout 10 "$BINARY" || true
          if (($(date +%s) - $start < 10)); then
            echo "::error::Process terminated early! Potential errors in build."
            exit 1
          fi
          echo "Starting CLI..."
          timeout 10 "$BINARY" --user-interface=cli || true

      - name: Upload Velopack packages
        uses: actions/upload-artifact@v7
        with:
          name: velopack-${{ steps.build-exe.outputs.out-filename }}
          path: |
            build/*/velopack/TiLiA-${{ steps.build-exe.outputs.pack-version }}-*.nupkg
            build/*/velopack/*-Setup.pkg
            build/*/velopack/*-Setup.exe
            build/*/velopack/*.AppImage
          retention-days: 1

  deploy:
    name: Create release
    needs: build
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    env:
      QT_DEBUG_PLUGINS: 1
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Download Velopack packages
        uses: actions/download-artifact@v8
        with:
          path: build/velopack/
          pattern: 'velopack-TiLiA-v*'
          merge-multiple: true

      - name: Test Linux portable in a clean environment
        continue-on-error: true
        run: |
          PORTABLE_NAME="${{ needs.build.outputs.linux-build }}"
          PORTABLE=$(find build/velopack -name "$PORTABLE_NAME" 2>/dev/null | head -1)
          if [ -z "$PORTABLE" ]; then
            echo "Portable not found: $PORTABLE_NAME"
            ls build -ltraR |egrep -v '\.$|\.\.|\.:|\.\/|total|^d' | sed '/^$/d' || true
          else
            if [[ "$PORTABLE" == *.AppImage ]]; then
              chmod +x "$PORTABLE"
              APPIMAGE=$(realpath "$PORTABLE")
              TMPDIR=$(mktemp -d)
              cd "$TMPDIR" && "$APPIMAGE" --appimage-extract 2>/dev/null || true
              EXE_NAME=$(basename "$APPIMAGE" | cut -d'-' -f1)
              BINARY=$(find "$TMPDIR/squashfs-root" -maxdepth 3 -name "$EXE_NAME" -type f | head -1)
            else
              BINARY="$PORTABLE"
            fi
            chmod ugo+x "$BINARY"
            echo "Starting GUI..."
            start=$(date +%s)
            timeout 10 "$BINARY" || true
            if (($(date +%s) - $start < 10)); then
              echo "Linux didn't work... Check libraries with previous step?";
            else
              echo "Linux started in a clean environment!";
            fi
            echo "Starting CLI..."
            timeout 10 "$BINARY" --user-interface=cli || true
          fi

      - name: Upload
        uses: "softprops/action-gh-release@v3"
        id: release
        with:
          tag_name: ${{github.ref_name}}
          make_latest: ${{github.event_name == 'push'}}
          generate_release_notes: true
          files: build/velopack/**

      - name: Check output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view ${{ github.ref_name }} --repo ${{ github.repository }} --json assets --jq '[.assets[].name]')
          FULL_PACKAGES=$(echo "$ASSETS" | jq -r '.[] | select(endswith("-full.nupkg"))')
          DOWNLOADS=$(echo "$ASSETS" | jq -r '.[] | select(test("(Setup\\.(pkg|exe)|\\.AppImage)$"))')
          DOWNLOAD_COUNT=$(echo "$DOWNLOADS" | grep -c . || true)
          echo "Full packages:"; echo "$FULL_PACKAGES"
          echo "User downloads ($DOWNLOAD_COUNT/4):"; echo "$DOWNLOADS"
          MISSING_CHANNELS=()
          for channel in macos-silicon macos-intel ubuntu windows; do
            echo "$FULL_PACKAGES" | grep -q "${channel}-full\.nupkg$" || MISSING_CHANNELS+=("$channel")
          done
          if [ "${#MISSING_CHANNELS[@]}" -gt 0 ] || [ "$DOWNLOAD_COUNT" -ne 4 ]; then
            [ "${#MISSING_CHANNELS[@]}" -gt 0 ] && echo "::error::Missing full.nupkg for channels: ${MISSING_CHANNELS[*]}"
            [ "$DOWNLOAD_COUNT" -ne 4 ] && echo "::error::Expected 4 user downloads, got $DOWNLOAD_COUNT."
            exit 1
          fi

name: Packages

on:
  push:
    branches:
      - main
      - dev
      - v1-prerelease
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'

  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'

  workflow_dispatch:

jobs:
  check:
    name: check packages (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # Pull requests test the oldest and newest supported Python; pushes
        # and manual runs test every supported version.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12", "3.14"]' || '["3.12", "3.13", "3.14"]') }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check packages
      run: python scripts/check_packages.py

  browser:
    name: library in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install the packages and Playwright
      run: python -m pip install ./packages/tilia-core && python -m pip install ./packages/tilia-library pytest "playwright>=1.40"

    # An apt mirror can crawl without stalling: 4 of 45 recent runs spent 9 to 12
    # minutes here at about 35 kB/s, instead of the usual 13 to 39 s. So each
    # attempt gets a time limit. A later attempt continues from the debs already
    # downloaded, without Azure's mirror, which is the first on the runner's list.
    #
    # install-deps runs as root because Playwright otherwise starts apt through
    # its own sudo, and a limit around that leaves apt running and holding its locks.
    - name: Install Chromium
      run: |
        limit=120 # seconds
        attempts=3
        for attempt in $(seq "$attempts"); do
          if sudo timeout --kill-after=15 "$limit" "$(command -v python)" -m playwright install-deps chromium \
            && timeout --kill-after=15 "$limit" python -m playwright install chromium; then
            echo "Chromium install succeeded on attempt $attempt of $attempts"
            exit 0
          fi
          echo "::warning::Chromium install attempt $attempt failed or passed ${limit}s"
          # The limit can land while packages are being unpacked.
          sudo dpkg --configure -a || true
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
        done
        echo "::error::Chromium install failed after $attempts attempts of up to ${limit}s each"
        exit 1

    - name: Run the browser tests
      working-directory: packages/tilia-library
      run: python -m pytest tests/browser

  # How long reading a .tla file takes (SC-004). A time on a shared runner says
  # little, so the step's result is there to be read, and doesn't fail the run.
  speed:
    name: reading speed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install tilia-core
      run: |
        python -m pip install --upgrade "pip>=25.1"
        python -m pip install ./packages/tilia-core --group packages/tilia-core/pyproject.toml:tests

    - name: Run the benchmark
      continue-on-error: true
      working-directory: packages/tilia-core
      run: python -m pytest tests/tla/test_tla_speed.py --run-benchmarks -p no:cacheprovider

  # The job above has no music21, which is what proves the core works without
  # the extra, so the core's harmony tests skip there. This one installs the
  # extra and runs every test of the core.
  #
  # Not every system and version: what music21 changes is the same on each, in
  # pure Python, and the file-system tests run in the job above. Python's oldest
  # and newest on Linux, plus the newest on Windows, where music21's compiled
  # dependencies install differently. macOS runners are short, so none here.
  harmony:
    name: core with music21 (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.12'
        - os: ubuntu-latest
          python-version: '3.14'
        - os: windows-latest
          python-version: '3.14'
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tilia-core with the harmony extra
      run: |
        python -m pip install --upgrade "pip>=25.1"
        python -m pip install "./packages/tilia-core[harmony]" --group packages/tilia-core/pyproject.toml:dev

    # The harmony tests skip when music21 is missing (importorskip), and a
    # skipped test passes. This fails the job instead.
    - name: Check that music21 imports
      run: python -c "import music21; print(music21.__version__)"

    - name: Run the core's tests
      working-directory: packages/tilia-core
      run: python -m pytest -p no:cacheprovider -ra

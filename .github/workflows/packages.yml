name: Packages

on:
  push:
    branches:
      - main
      - dev
      - v1-prerelease
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'

  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'

jobs:
  check:
    name: check packages (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check packages
      run: python scripts/check_packages.py

  browser:
    name: library in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install the packages and Playwright
      run: python -m pip install ./packages/tilia-core && python -m pip install ./packages/tilia-library pytest "playwright>=1.40"

    - name: Install Chromium
      run: python -m playwright install --with-deps chromium

    - name: Run the browser tests
      working-directory: packages/tilia-library
      run: python -m pytest tests/browser

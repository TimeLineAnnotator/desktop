name: Checks

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'

  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'

  workflow_dispatch:

jobs:
  build:
    name: run tests (${{ matrix.python-version }}, ${{ matrix.os }})${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the oldest and newest supported Python; pushes
        # and manual runs test every supported version.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12", "3.14"]' || '["3.12", "3.13", "3.14"]') }}
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
        - os: ubuntu-latest
          path: ~/.cache/pip
        - os: macos-latest
          path: ~/Library/Caches/pip
        - os: windows-latest
          path: ~\AppData\Local\pip\Cache
        - os: ubuntu-latest
          python-version: '3.12'
          suffix: ' [with coverage]'
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup additional Linux dependencies
      if: runner.os == 'Linux'
      run: |
        chmod +x ./scripts/linux-setup.sh
        ./scripts/linux-setup.sh

    - uses: actions/cache@v5
      with:
        path: ${{ matrix.path }}
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
         ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -e . --group ci-tests

    - name: List installed packages
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        pip freeze

    - name: Lint with ruff
      run: |
        ruff check
      continue-on-error: true

    - name: Test with pytest
      if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
      run: |
        pytest -v -n auto --reruns=2 --timeout=10 --timeout-method=thread

    - name: Test with pytest (coverage)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        pytest -v -n auto --reruns=2 --timeout=10 --timeout-method=thread --cov-report= --cov=tilia

    - name: Generate Coverage Report
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
          coverage report -m

    - name: Check Program
      shell: bash
      run: |
        echo "Starting GUI..."
        QT_DEBUG_PLUGINS=1 tilia & TILIA_PID=$!; sleep 10; kill $TILIA_PID 2>/dev/null || echo "WARNING: GUI exited before 10s"; wait $TILIA_PID 2>/dev/null || true
        echo "Starting CLI..."
        printf 'about\nquit\n' | tilia -i=cli || true

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The CSP lets scripts run from local files (any local file: `file:` can't be
  narrowed to this folder) and from Qt's resources (qwebchannel.js), never
  inline, and no event-handler attribute runs. The page loads only this
  folder's scripts. viewer.js also strips scripts, foreign content and event
  handlers from a score's SVG before showing it, so nothing that comes with a
  score can run. The page makes no network requests.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file: qrc: 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src data:">
<title>TiLiA Score Viewer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; overflow: hidden; }
  #score { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; }
  #score { z-index: 0; user-select: none; -webkit-user-select: none; }
  #score > svg:not(#tilia-groups, #tilia-group-labels, #tilia-highlights) { display: block; }
  /* Behind the score, in the score box's scrolling coordinates. */
  #tilia-groups { position: absolute; left: 0; top: 0; z-index: -1; overflow: visible; }
  /* Behind the note groups: what's selected in other timelines. */
  #tilia-highlights { position: absolute; left: 0; top: 0; z-index: -2; overflow: visible; }
  #tilia-highlights rect { fill: rgba(26, 127, 255, 0.1); }
  #tilia-groups .blob { opacity: 0.32; }
  #tilia-groups .blob.active { opacity: 0.55; }
  #tilia-group-labels { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #tilia-group-labels text {
    font: 600 11px system-ui, sans-serif;
    fill: #222;
    stroke: #fff;
    stroke-width: 3px;
    paint-order: stroke;
    pointer-events: none;
  }
  #tilia-band {
    position: absolute;
    border: 1px solid #1a7fff;
    background: rgba(26, 127, 255, 0.12);
    pointer-events: none;
  }
  g.note, g.rest { cursor: pointer; }
  /* An outline around the selected element's glyphs, so its colour shows. */
  .tilia-selected {
    filter: drop-shadow(1.5px 0 0 #1a7fff) drop-shadow(-1.5px 0 0 #1a7fff)
            drop-shadow(0 1.5px 0 #1a7fff) drop-shadow(0 -1.5px 0 #1a7fff);
  }
</style>
</head>
<body>
<div id="score"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<!-- Before the toolkit, so that it hears when the toolkit's runtime is ready. -->
<script src="viewer.js"></script>
<script id="verovio-toolkit" src="verovio-toolkit-wasm.js"></script>
</body>
</html>

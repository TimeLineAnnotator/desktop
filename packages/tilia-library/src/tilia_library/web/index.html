<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiLiA Library</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cline x1='18.4' y1='18.4' x2='24' y2='24' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/css/library.css">
<script src="/web/js/lib/boot-guard.js"></script>
<script type="module" src="/web/js/main.js"></script>
</head>
<body>
<header>
  <h1>TiLiA Library</h1>
  <select id="corpus-pick"></select>
  <button id="corpus-remove" type="button">Remove from library</button>
  <span id="corpus-path" class="muted"></span>
</header>
<div id="notices"></div>
<nav id="tabs">
  <button type="button" data-panel="files">Files</button>
  <button type="button" data-panel="query">Query</button>
  <button type="button" data-panel="categories">Categories</button>
  <button type="button" data-panel="statistics">Statistics</button>
  <button type="button" data-panel="edit-log">Edit log</button>
</nav>
<div id="changed" class="changed" hidden>Files changed — re-run? <button id="changed-rerun" type="button">Re-run</button></div>
<main>
  <section class="panel" data-panel="files" hidden></section>
  <section class="panel" data-panel="query" hidden></section>
  <section class="panel" data-panel="categories" hidden></section>
  <section class="panel" data-panel="statistics" hidden></section>
  <section class="panel" data-panel="edit-log" hidden></section>
  <section id="how-to-add" hidden>
    <h2>No folders yet</h2>
    <p>Open a folder of TiLiA files by running <code>tilia library FOLDER</code> in a terminal.</p>
  </section>
</main>
<div id="status"></div>
</body>
</html>

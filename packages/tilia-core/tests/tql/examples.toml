# TQL 0.1.0: the printed examples as tests (tql.md §11; constitution, Principle V).
#
# Each [[example]] runs `query` on a made-up file, its `fixture`, and must give
# exactly `rows`, in any order; `plan` names where the plan prints it. The
# expected rows are written from the musical reading, not copied from an
# implementation: where an implementation disagrees, one of them has a bug.
#
# A row lists the units of one match, numbered unit by numbered unit ($1, $2 …)
# and separated by " | "; several units of one step are separated by ", ".
# A unit is "label@start", its start in seconds as the fixture gives it; a
# chord or a key goes by its label as TiLiA shows it. Where the query marks a
# result with @, the result's units are in [brackets]. A query of only WHERE
# that lists timelines gives their names.
#
# A bulk edit also lists its planned writes in `writes`:
#   "unit: field = value"           SET
#   "unit: tag x", "unit: untag x"   TAG, UNTAG
#   "unit: delete"                   DELETE
#   "+ label@start..end level n"     a unit GROUP adds
#   "timeline: field = value"        a timeline's field
# `core_only = true` marks writes only tilia-core can make (timeline fields
# arrive with T5); an implementation without them checks the rows only.
#
# A fixture is one file: `length` (the media length, in seconds), `fields` (the
# file's fields), `grammar` (its label grammar: "de Clercq", or none, when each
# label is read whole, tql.md §5) and its timelines, each with a `name`, a
# `kind` and its units:
#   hierarchy  units = [[label, level, start, end, colour?], …]  (level 1 = the lowest)
#   marker     units = [[label, time], …]
#   range      rows = [names]; units = [[row, label, start, end], …]
#   harmony    keys = [[time, tonic, "major" | "minor"], …] and
#              chords = [[time, root, quality, inversion?, applied_to?], …],
#              a quality as TiLiA stores it
#   beats      a beat every `every` seconds from `start`, `beats_per_bar` to a
#              bar, and a bar per printed number in `numbers` (or `bars` = n for
#              bars 1 … n)
# Roles are the plan's: a hierarchy called "Form (X)" has role form and author
# X, a marker timeline called "Cadences" role cadences, and a harmony timeline
# the roles harmony (its chords) and keys (its keys).

# ==========================================================================

# ==========================================================================
# §4.2, the worked example's match table
# ==========================================================================

[[example]]
plan = "§4.2 table, row 1"
query = "ST[continuation{2}] IN form"
fixture = "exposition"
rows = ["ST@10"]
why = "two of its children, in a row, are continuations"

[[example]]
plan = "§4.2 table, row 2"
query = "ST[CONSISTS OF presentation THEN continuation{2}] IN form"
fixture = "exposition"
rows = ["ST@10"]
why = "these are all its children, in this order"

[[example]]
plan = "§4.2 table, row 3"
query = "exposition[continuation] IN form"
fixture = "exposition"
rows = []
why = "the continuations are its grandchildren, not its children"

[[example]]
plan = "§4.2 table, row 4"
query = "exposition[CONTAINS continuation] IN form"
fixture = "exposition"
rows = ["exposition@0"]
why = "CONTAINS looks at any depth"

[[example]]
plan = "§4.2 table, row 5"
query = "* THEN *[continuation{2}] IN form"
fixture = "exposition"
rows = ["TR@8 | ST@10"]
why = "a unit followed by a unit with two continuations"

[[example]]
plan = "§4.2 table, row 6"
query = "MT THEN ST[continuation{2}] IN form"
fixture = "exposition"
rows = []
why = "THEN means directly followed by, and TR comes between"

[[example]]
plan = "§4.2 table, row 7"
query = "continuation[parent = ST] IN form"
fixture = "exposition"
rows = ["continuation@14", "continuation@18"]
why = "not MT's, whose parent is MT"

[[example]]
plan = "§4.2 table, row 8"
query = "ST[CONTAINS PAC IN cadences] IN form"
fixture = "exposition"
rows = ["ST@10"]
why = "a PAC lies within ST"

[[example]]
plan = "§4.2 table, row 9"
query = "ST[ENDS WITH PAC IN cadences] IN form"
fixture = "exposition"
rows = ["ST@10"]
why = "the PAC is ST's last cadence; the EC comes before it"

[[example]]
plan = "§4.2 table, row 10"
query = "ST[ENDS WITH EC IN cadences] IN form"
fixture = "exposition"
rows = []
why = "the EC is not ST's last cadence"

[[example]]
plan = "§4.2 table, row 11"
query = "* IN cadences ENDS ST IN form"
fixture = "exposition"
rows = ["PAC@21.5 | ST@10"]
why = "the mirror form: the cadence that ends ST"

[[example]]
plan = "§4.2 table, row 12"
query = "* IN cadences SAME END ST IN form"
fixture = "exposition"
rows = []
why = "timing, not order: the PAC comes before ST's written end"

[[example]]
plan = "§4.2 table, row 13"
query = "MT[ENDS WITH HC IN cadences] THEN TR IN form"
fixture = "exposition"
rows = ["MT@0 | TR@8"]
why = "MT's last cadence is an HC, and TR follows it"


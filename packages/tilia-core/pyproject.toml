[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tilia-core"
version = "0.0.1"
description = "TiLiA's file format and corpus tools, without a user interface"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {email = "tilia@tilia-app.com"},
    {name = "Felipe Defensor"},
    {name = "Anne Foo"}
]

[project.urls]
Homepage = "https://tilia-app.com"
Repository = "https://github.com/TimeLineAnnotator/desktop"

[project.optional-dependencies]
regex = ["regex>=2024.9.11"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "tomli>=2.0; python_version < '3.11'",
    "regex>=2024.9.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tilia-core"
version = "0.0.2"
description = "TiLiA's file format and corpus tools, without a user interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=6.0.0", "webcolors>=24.8.0"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {email = "tilia@tilia-app.com"},
    {name = "Felipe Defensor"},
    {name = "Anne Foo"}
]

[project.optional-dependencies]
# Checking harmonies and keys, and later importing them, reads music21.
harmony = ["music21>=9.1"]

[project.scripts]
tilia = "tilia_core.commands:main"

[project.urls]
Homepage = "https://tilia-app.com"
Repository = "https://github.com/TimeLineAnnotator/desktop"

[dependency-groups]
# jsonschema checks files against the format's schema in the tests only: it
# pulls in a compiled package, which the core itself never imports.
dev = ["pytest>=8.0.0", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/timemap", "tests/importers", "tests/commands"]

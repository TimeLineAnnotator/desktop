# The files .gitattributes keeps byte for byte (.tla files, the format's schema,
# and the data in tilia-core's tests/tla folders) are left alone: no hook may fix
# their whitespace, and a score in them may be large. Python code there is checked.
exclude: '^packages/tilia-core/tests/tla/[^/]+/(?!.*\.py$)|\.tla$|\.schema\.json$'

repos:
  - repo: https://github.com/psf/black
    rev: 22.12.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [ --fix ]

# see https://nuitka.net/user-documentation/nuitka-package-config.html for help on this file.
# yamllint disable rule:line-length
# yamllint disable rule:indentation
# yamllint disable rule:comments-indentation
# yamllint disable rule:comments
# too many spelling things, spell-checker: disable
---
- module-name: "music21"
  anti-bloat:
    - description: "remove tests"
      replacements_plain:
        "'mainTest',": ""
        "'test',": ""
        "from music21.test.testRunner import mainTest": ""
        "from music21 import test": ""
    - description: "meter/midi/braille import their own test(s) submodule unconditionally at package init - nofollow-import-to excludes test.py/tests.py from compilation (by design, real bloat elsewhere too), so the import line itself has to go, not the exclusion. Checked every music21 __init__.py for this exact pattern (module path ending in bare .test/.tests, not e.g. testFiles/test_base) - these three plus the top-level music21/__init__.py (handled by 'remove tests' above) are the whole list."
      global_replacements_plain:
        "from music21.meter import tests": ""
        "from music21.midi import tests": ""
        "from music21.braille import test": ""

- module-name: "executing._pytest_utils"
  anti-bloat:
    - description: "remove pytest reference"
      change_function:
        "is_pytest_compatible": "'(lambda : False)'"
      when: "not use_pytest"

- module-name: "tilia.utils"
  anti-bloat:
    - description: "slightly hacky way of forcing prod if env file is not found"
      replacements_plain:
        'os.environ["ENVIRONMENT"] = "dev"': 'os.environ["ENVIRONMENT"] = "prod"'

- module-name: "tilia.boot"
  anti-bloat:
    - description: "CLI doesn't currently work in the executable"
      replacements_re:
        'elif interface == "cli":(\n|.)*?return CLI\(\)': ''
      replacements_plain:
        'choices=["qt", "cli"]': 'choices=["qt"], help="CLI option is currently not available in the exe. Run from source instead."'
